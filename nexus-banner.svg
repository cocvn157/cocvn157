<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111622" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090c12" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .pulse { animation: pulseAnim 2.4s infinite ease-in-out; }
    .flow { stroke-dasharray: 8 6; animation: dashFlow 12s linear infinite; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -280; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Top Accent Line -->
  <rect x="1" y="1" width="1198" height="3" rx="2" fill="url(#emeraldGlow)"/>

  <!-- Top Telemetry Bar -->
  <rect x="28" y="22" width="1144" height="34" rx="8" fill="#0b0f17" stroke="#1e293b" stroke-width="1"/>
  <circle cx="48" cy="39" r="5" fill="#10b981" class="pulse"/>
  <text x="64" y="43" fill="#10b981" font-size="11" font-weight="700" class="mono">NEXUS-9 // AUTONOMOUS AI OS ONLINE</text>
  <text x="330" y="43" fill="#64748b" font-size="11" class="mono">ARCHITECT: @cocvn157</text>
  <text x="520" y="43" fill="#94a3b8" font-size="11" class="mono">SWARM: 6 ACTIVE AGENTS (DAG PIPELINE)</text>
  <text x="830" y="43" fill="#38bdf8" font-size="11" font-weight="600" class="mono">UPSTREAM: 58 KERNEL &amp; RUNTIME PRs</text>
  <text x="1085" y="43" fill="#10b981" font-size="11" font-weight="700" class="mono">24/7 AUTO</text>

  <!-- Left Hero Identity -->
  <text x="32" y="98" fill="#f8fafc" font-size="28" font-weight="800" letter-spacing="-0.5" class="sans">NEXUS-9 Autonomous AI &amp; Systems Architecture</text>
  <text x="32" y="126" fill="#94a3b8" font-size="14" class="sans">Zero-Human-Intervention Multi-Agent Pipelines • C++20 AI Kernels • Scala 3 ZIO • Rust • Go • MCP</text>

  <!-- KPI Pills -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="175" height="54" rx="10" fill="url(#cardGrad)" stroke="#1e293b"/>
    <text x="14" y="22" fill="#64748b" font-size="10" font-weight="700" class="mono">AUTONOMOUS SWARM</text>
    <text x="14" y="42" fill="#10b981" font-size="15" font-weight="800" class="mono">6 Neural Nodes</text>

    <rect x="188" y="0" width="185" height="54" rx="10" fill="url(#cardGrad)" stroke="#1e293b"/>
    <text x="202" y="22" fill="#64748b" font-size="10" font-weight="700" class="mono">UPSTREAM SYSTEMS</text>
    <text x="202" y="42" fill="#38bdf8" font-size="15" font-weight="800" class="mono">58 Active PRs</text>

    <rect x="386" y="0" width="195" height="54" rx="10" fill="url(#cardGrad)" stroke="#1e293b"/>
    <text x="400" y="22" fill="#64748b" font-size="10" font-weight="700" class="mono">CORE RUNTIMES</text>
    <text x="400" y="42" fill="#f8fafc" font-size="14" font-weight="700" class="mono">C++20 • ZIO • Rust</text>
  </g>

  <!-- Bottom Terminal Log Bar -->
  <rect x="32" y="220" width="550" height="74" rx="10" fill="#070a0f" stroke="#1e293b"/>
  <text x="48" y="242" fill="#10b981" font-size="11" class="mono">$ nexus-daemon --mode=autonomous --agents=6 --verify-ci</text>
  <text x="48" y="261" fill="#94a3b8" font-size="11" class="mono">[✓] DAG Router: Ingest → Recon → Planner → Synth → Verifier → Dispatch</text>
  <text x="48" y="280" fill="#38bdf8" font-size="11" class="mono">[✓] Live OS Endpoint: https://cocvn157.github.io/ (100% Automated)</text>

  <!-- Right Interactive DAG Visualization -->
  <g transform="translate(615, 76)">
    <rect x="0" y="0" width="555" height="218" rx="12" fill="#080b11" stroke="#1e293b"/>
    <text x="18" y="24" fill="#64748b" font-size="10" font-weight="700" class="mono">LIVE MULTI-AGENT EXECUTION TOPOLOGY (DAG)</text>

    <!-- Connecting Edges -->
    <path d="M 115 75 C 155 75, 165 55, 205 55" fill="none" stroke="#06b6d4" stroke-width="2" class="flow"/>
    <path d="M 115 75 C 155 75, 165 135, 205 135" fill="none" stroke="#10b981" stroke-width="2" class="flow"/>
    <path d="M 335 55 C 375 55, 385 95, 420 95" fill="none" stroke="#6366f1" stroke-width="2" class="flow"/>
    <path d="M 335 135 C 375 135, 385 95, 420 95" fill="none" stroke="#10b981" stroke-width="2" class="flow"/>

    <!-- Node 1: Trigger/Recon -->
    <rect x="20" y="50" width="95" height="50" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="32" y="72" fill="#38bdf8" font-size="10" font-weight="700" class="mono">01 // RECON</text>
    <text x="32" y="88" fill="#94a3b8" font-size="9" class="mono">AST &amp; Web</text>

    <!-- Node 2: Neural Planner -->
    <rect x="205" y="30" width="130" height="50" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <text x="217" y="52" fill="#818cf8" font-size="10" font-weight="700" class="mono">02 // PLANNER</text>
    <text x="217" y="68" fill="#94a3b8" font-size="9" class="mono">DAG Reasoning</text>

    <!-- Node 3: Code & MCP Synth -->
    <rect x="205" y="110" width="130" height="50" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="217" y="132" fill="#34d399" font-size="10" font-weight="700" class="mono">03 // SYNTH</text>
    <text x="217" y="148" fill="#94a3b8" font-size="9" class="mono">Code / MCP / n8n</text>

    <!-- Node 4: Sandbox & Dispatch -->
    <rect x="420" y="70" width="115" height="54" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="520" cy="84" r="4" fill="#10b981" class="pulse"/>
    <text x="432" y="92" fill="#10b981" font-size="10" font-weight="700" class="mono">04 // DISPATCH</text>
    <text x="432" y="108" fill="#cbd5e1" font-size="9" class="mono">Verified PR/API</text>

    <!-- Bottom Metrics inside Topology Card -->
    <line x1="18" y1="180" x2="537" y2="180" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="200" fill="#10b981" font-size="10" class="mono">STATUS: ALL PIPELINES NOMINAL</text>
    <text x="245" y="200" fill="#94a3b8" font-size="10" class="mono">THROUGHPUT: 148.4 TOK/S</text>
    <text x="425" y="200" fill="#38bdf8" font-size="10" class="mono">CI PASS: 99.4%</text>
  </g>
</svg>
